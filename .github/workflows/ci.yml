name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Security regression — no hardcoded secrets
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist -E 'dev-local-key-2024|test-nonce-12345' . ; then
            echo "Hardcoded auth bypass found in frontend source"
            exit 1
          fi
          if grep -RIn --exclude-dir=node_modules --exclude-dir=dist -E 'JACSKFOEX|cpanel.*token.*=.*['\''\"][A-Za-z0-9]{20,}' scripts/ ; then
            echo "Possible cPanel secret in scripts"
            exit 1
          fi

  plugin-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: PHP syntax check
        run: |
          find ai-web-site-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security regression — auth bypasses
        run: |
          if grep -RIn -E "dev-local-key-2024|user_id\s*=\s*2\s*;|TEMPORARY: Skipping authentication" ai-web-site-plugin ; then
            echo "Auth bypass / hardcoded user found in plugin"
            exit 1
          fi
          if grep -Rn "permission_callback" ai-web-site-plugin/includes/class-ai-web-site.php | grep -i logs | grep '__return_true' ; then
            echo "Public /logs endpoint must not use __return_true"
            exit 1
          fi
          if grep -RIn "Access-Control-Allow-Origin: \*" ai-web-site-plugin/includes/class-website-manager.php ; then
            echo "Wildcard CORS with credentials risk"
            exit 1
          fi
